<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAINIVA App channel · Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%230a7c8c%22/%3E%3Cpath d=%22M6 18V11l6-4 6 4v7%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22/%3E%3C/svg%3E">
<style>
  :root {
    --brand: #0a7c8c; --brand-2: #0e9aa7; --brand-soft: #e3f4f6;
    --ink: #13232b; --muted: #61737c; --line: #e3e9ec; --bg: #f3f6f7; --card: #ffffff;
    --me: var(--brand); --me-ink: #ffffff; --them: #ffffff; --ok: #1f9d55; --warn: #c27a00; --danger: #e5484d;
    --call-from: #11606b; --call-to: #0b2a31; --radius: 18px; --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #dfe7ea; font-family: var(--font); color: var(--ink); }
  body { display: grid; place-items: center; }
  /* A phone on a desk; full screen on a real phone. */
  .phone { position: relative; width: 390px; height: 844px; background: var(--bg); border-radius: 46px; overflow: hidden;
           box-shadow: 0 0 0 11px #11181c, 0 0 0 13px #2b343a, 0 30px 80px rgba(0,0,0,.35); display: flex; flex-direction: column; }
  @media (max-width: 500px) { body { display: block; } .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; } .status-bar { display: none; } }
  .status-bar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px 0 34px; font-size: 15px; font-weight: 600; background: var(--brand); color: #fff; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .screen { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .screen.on { display: flex; }

  /* App bar */
  .bar { flex: none; background: var(--brand); color: #fff; padding: 10px 16px 14px; display: flex; align-items: center; gap: 10px; }
  .bar h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .bar .sub { font-size: 12.5px; opacity: .85; margin-top: 2px; }
  .bar .grow { flex: 1; min-width: 0; }
  .bar .grow > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 40px; height: 40px; border: 0; border-radius: 12px; background: rgba(255,255,255,.14); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn svg { width: 22px; height: 22px; }

  /* Sign in */
  .hero { background: linear-gradient(160deg, var(--brand), var(--brand-2)); color: #fff; padding: 36px 26px 44px; }
  .logo { width: 62px; height: 62px; border-radius: 18px; background: rgba(255,255,255,.18); display: grid; place-items: center; margin-bottom: 18px; }
  .logo svg { width: 34px; height: 34px; }
  .hero h2 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.02em; }
  .hero p { margin: 0; opacity: .9; font-size: 15px; line-height: 1.45; }
  .form { padding: 22px 22px; display: flex; flex-direction: column; gap: 14px; margin-top: -22px; background: var(--bg); border-radius: 22px 22px 0 0; flex: 1; }
  label { font-size: 13px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 6px; }
  input.field { width: 100%; height: 50px; border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; font-size: 16px; background: #fff; color: var(--ink); font-family: inherit; }
  input.field:focus { outline: 2px solid var(--brand-2); border-color: transparent; }
  .primary { height: 52px; border: 0; border-radius: 15px; background: var(--brand); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .primary:disabled { opacity: .6; }
  .fine { font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.5; margin-top: auto; padding-bottom: 6px; }
  .fine b { color: var(--brand); }

  /* Directory */
  .search { flex: none; padding: 12px 16px 6px; background: var(--brand); }
  .search .box { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 14px; padding: 0 12px; height: 46px; }
  .search input { border: 0; outline: 0; font-size: 16px; flex: 1; background: transparent; font-family: inherit; color: var(--ink); }
  .search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
  .search-pad { flex: none; height: 14px; background: linear-gradient(var(--brand), var(--brand)) top/100% 50% no-repeat; }
  .list { flex: 1; overflow-y: auto; padding: 4px 14px 24px; }
  .group-h { font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 16px 6px 8px; }
  .row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--card); border: 0; border-radius: 16px; margin-bottom: 8px; text-align: left; cursor: pointer; font-family: inherit; color: var(--ink); box-shadow: 0 1px 2px rgba(16,40,48,.06); }
  .row:active { background: #f7fbfc; }
  .row .pin { width: 42px; height: 42px; border-radius: 13px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
  .row .pin svg { width: 22px; height: 22px; }
  .row .t { font-weight: 650; font-size: 16px; }
  .row .d { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .badge { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; flex: none; margin-left: auto; }
  .badge.open { background: #e5f6ec; color: var(--ok); } .badge.closed { background: #fff3dd; color: var(--warn); }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }

  /* Destination sheet */
  .dest-card { margin: 18px 16px; background: var(--card); border-radius: 22px; padding: 22px; box-shadow: 0 1px 2px rgba(16,40,48,.06); }
  .dest-card h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.01em; }
  .dest-card .g { color: var(--muted); font-size: 14px; }
  .dest-card .desc { margin-top: 12px; font-size: 14.5px; line-height: 1.5; color: #33464f; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 16px; }
  .action { border: 0; border-radius: 20px; padding: 20px 14px; background: var(--card); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: var(--ink); font-family: inherit; box-shadow: 0 1px 2px rgba(16,40,48,.06); }
  .action .ic { width: 54px; height: 54px; border-radius: 17px; display: grid; place-items: center; color: #fff; }
  .action .ic svg { width: 27px; height: 27px; }
  .action.chat .ic { background: var(--brand); } .action.voice .ic { background: var(--ok); }
  .action:disabled { opacity: .45; }
  .note { margin: 16px 20px; font-size: 13px; color: var(--muted); line-height: 1.5; text-align: center; white-space: pre-line; }

  /* Chat */
  .thread { flex: 1; overflow-y: auto; padding: 14px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 80%; padding: 10px 13px; border-radius: 18px; font-size: 15.5px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 6px; }
  .msg.them { align-self: flex-start; background: var(--them); border-bottom-left-radius: 6px; box-shadow: 0 1px 2px rgba(16,40,48,.07); }
  .who { font-size: 12px; color: var(--muted); margin: 8px 8px 0; align-self: flex-start; font-weight: 600; }
  .who .ai { background: #eef0ff; color: #4b51c9; border-radius: 6px; padding: 1px 6px; margin-left: 4px; font-size: 11px; }
  .sys { align-self: center; font-size: 12.5px; color: var(--muted); background: #e8eef0; padding: 5px 11px; border-radius: 999px; margin: 6px 0; text-align: center; max-width: 90%; }
  .time { font-size: 11px; opacity: .7; margin-top: 3px; text-align: right; }
  .msg img { max-width: 100%; border-radius: 12px; display: block; }
  .composer { flex: none; display: flex; gap: 8px; align-items: center; padding: 10px 12px 14px; background: #fff; border-top: 1px solid var(--line); }
  .composer input { flex: 1; height: 46px; border-radius: 23px; border: 1px solid var(--line); padding: 0 16px; font-size: 16px; font-family: inherit; background: var(--bg); color: var(--ink); }
  .composer input:focus { outline: 2px solid var(--brand-2); border-color: transparent; }
  .send { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--brand); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
  .send svg { width: 21px; height: 21px; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 4px 8px; }

  /* Call overlay */
  .call { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 0%, var(--call-from), var(--call-to) 70%); color: #fff; display: none; flex-direction: column; align-items: center; padding: 90px 24px 60px; z-index: 5; }
  .call.on { display: flex; }
  .call .avatar { width: 116px; height: 116px; border-radius: 50%; background: rgba(255,255,255,.12); display: grid; place-items: center; margin-bottom: 22px; position: relative; }
  .call .avatar svg { width: 54px; height: 54px; }
  .call .avatar.ringing::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
  .call h2 { margin: 0; font-size: 26px; text-align: center; letter-spacing: -.01em; }
  .call .cs { margin-top: 8px; font-size: 16px; opacity: .85; }
  .call .timer { margin-top: 6px; font-size: 18px; font-variant-numeric: tabular-nums; opacity: .95; min-height: 24px; }
  .call .controls { margin-top: auto; display: flex; gap: 34px; align-items: center; }
  .round { width: 72px; height: 72px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: rgba(255,255,255,.16); color: #fff; }
  .round svg { width: 30px; height: 30px; }
  .round.on { background: #fff; color: #0b2a31; }
  .round.hang { background: var(--danger); }
  .round-l { font-size: 12.5px; text-align: center; margin-top: 8px; opacity: .85; }
  .toast { position: absolute; left: 16px; right: 16px; bottom: 22px; background: #1d2a30; color: #fff; padding: 12px 14px; border-radius: 14px; font-size: 14px; display: none; z-index: 9; }
  .toast.on { display: block; }
  .powered { font-size: 11.5px; text-align: center; color: var(--muted); padding: 6px 0 10px; flex: none; }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="status-bar"><span id="clock">9:41</span><span class="icons">●●●● 5G ▮</span></div>

  <!-- 1. Sign in -->
  <section class="screen on" id="s-login">
    <div class="hero">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-icon></svg></div>
      <h2 id="app-name">Công dân số</h2>
      <p id="tagline"></p>
    </div>
    <div class="form">
      <div><label for="f-name">Họ và tên</label><input class="field" id="f-name" autocomplete="name"></div>
      <div><label for="f-phone">Số điện thoại</label><input class="field" id="f-phone" inputmode="tel" autocomplete="tel"></div>
      <button class="primary" id="b-login">Đăng nhập</button>
      <div class="fine">Bản demo · Kết nối an toàn qua <b>HAINIVA</b></div>
    </div>
  </section>

  <!-- 2. Directory -->
  <section class="screen" id="s-dir">
    <div class="bar">
      <div class="grow"><h1 id="dir-title"></h1><div class="sub" id="hello">Xin chào</div></div>
      <button class="icon-btn" id="b-logout" title="Đăng xuất"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
    <div class="search"><div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="" autocomplete="off"></div></div>
    <div class="search-pad"></div>
    <div class="list" id="dir-list"><div class="empty">Đang tải…</div></div>
  </section>

  <!-- 3. Destination -->
  <section class="screen" id="s-dest">
    <div class="bar">
      <button class="icon-btn" data-back="s-dir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="grow"><h1>Liên hệ</h1></div>
    </div>
    <div class="dest-card">
      <h2 id="d-name">—</h2><div class="g" id="d-group"></div>
      <div class="desc" id="d-desc"></div>
      <div style="margin-top:12px" id="d-open"></div>
    </div>
    <div class="actions">
      <button class="action chat" id="b-chat"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span>Nhắn tin</button>
      <button class="action voice" id="b-call"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>Gọi thoại</button>
    </div>
    <div class="note" id="note"></div>
  </section>

  <!-- 4. Chat -->
  <section class="screen" id="s-chat">
    <div class="bar">
      <button class="icon-btn" data-back="s-dest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="grow"><h1 id="c-name">—</h1><div class="sub" id="c-status">Đang kết nối…</div></div>
      <button class="icon-btn" id="b-chat-call" title="Gọi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></button>
    </div>
    <div class="thread" id="thread"></div>
    <form class="composer" id="composer">
      <input id="msg" placeholder="Nhập tin nhắn…" autocomplete="off">
      <button class="send" type="submit" title="Gửi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
    </form>
  </section>

  <!-- Call -->
  <div class="call" id="call">
    <div class="avatar ringing" id="call-av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" data-icon></svg></div>
    <h2 id="call-name">—</h2>
    <div class="cs" id="call-status">Đang kết nối…</div>
    <div class="timer" id="call-timer"></div>
    <div class="controls">
      <div><button class="round" id="b-mute" title="Tắt tiếng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg></button><div class="round-l">Tắt tiếng</div></div>
      <div><button class="round hang" id="b-hang" title="Kết thúc"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.1.3-4.6.8v3.1c0 .4-.2.7-.6.9-1 .5-1.9 1.1-2.7 1.8-.2.2-.4.3-.7.3-.3 0-.5-.1-.7-.3L.3 13.2c-.2-.2-.3-.4-.3-.7 0-.3.1-.5.3-.7C3.4 8.9 7.5 7 12 7s8.6 1.9 11.7 4.8c.2.2.3.4.3.7 0 .3-.1.5-.3.7l-2.4 2.4c-.2.2-.4.3-.7.3-.3 0-.5-.1-.7-.3-.8-.7-1.7-1.3-2.7-1.8-.3-.2-.6-.5-.6-.9V9.8C15.1 9.3 13.6 9 12 9z"/></svg></button><div class="round-l">Kết thúc</div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="./livekit.js"></script>
<script type="module">
import { HainivaApp, HainivaError } from "./sdk.js";
const LK = window.LivekitClient;
const $ = (id) => document.getElementById(id);
const cfg = await (await fetch("./config")).json();
// The preset: words, colours and icon for this kind of organisation.
$("app-name").textContent = cfg.appName;
document.title = `${cfg.appName} · Demo`;
$("tagline").textContent = cfg.tagline;
$("dir-title").textContent = cfg.directoryTitle;
$("q").placeholder = cfg.searchPlaceholder;
$("note").textContent = cfg.note;
$("f-name").value = cfg.user.name; $("f-phone").value = cfg.user.phone;
document.querySelectorAll("[data-icon]").forEach((s) => s.innerHTML = cfg.icon);
const css = document.documentElement.style;
css.setProperty("--brand", cfg.colors.brand); css.setProperty("--brand-2", cfg.colors.brand2); css.setProperty("--brand-soft", cfg.colors.soft);
css.setProperty("--call-from", cfg.colors.callFrom); css.setProperty("--call-to", cfg.colors.callTo);
const staff = cfg.staff, staffLower = staff.toLowerCase();

// ── small helpers ───────────────────────────────────────────────────────────
const show = (id) => { document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id)); };
document.querySelectorAll("[data-back]").forEach((b) => b.onclick = () => { if (b.dataset.back === "s-dest") leaveChat(); show(b.dataset.back); });
let toastT; const toast = (t) => { $("toast").textContent = t; $("toast").classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => $("toast").classList.remove("on"), 3800); };
const hhmm = (iso) => new Date(iso).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
setInterval(() => $("clock").textContent = new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }), 1000);
const fold = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
const errText = (e) => {
  const c = e instanceof HainivaError ? e.code : "";
  return ({ destination_closed: "Nơi này đang ngoài giờ làm việc.", rate_limited: "Bạn thao tác quá nhanh, thử lại sau ít phút.",
            mode_not_allowed: "Nơi này không nhận hình thức liên hệ này.", destination_unavailable: "Nơi này tạm thời không nhận liên hệ.",
            channel_disabled: "Dịch vụ đang tạm dừng." })[c] ?? (c.startsWith("assertion_") ? "Ứng dụng chưa được HAINIVA chấp nhận (khoá kênh không khớp)." : "Không kết nối được, vui lòng thử lại.");
};

// ── the user this "partner app" already knows ────────────────────────────────
const KEY = `demo-user:${cfg.channelId}`;
let user = JSON.parse(localStorage.getItem(KEY) || "null");
const store = { get: () => localStorage.getItem(`hv:${cfg.channelId}`), set: (v) => localStorage.setItem(`hv:${cfg.channelId}`, v), remove: () => localStorage.removeItem(`hv:${cfg.channelId}`) };
const hv = new HainivaApp({
  baseUrl: cfg.baseUrl, tenantId: cfg.tenantId, channelId: cfg.channelId, platform: "web", appVersion: "demo-1",
  store,
  // Exactly what a partner app does: ask ITS backend, which holds the secret.
  getAssertion: async () => (await (await fetch("./assertion", { method: "POST", body: JSON.stringify(user) })).json()).assertion,
});

$("b-login").onclick = async () => {
  user = { name: $("f-name").value.trim(), phone: $("f-phone").value.trim() };
  if (!user.name) return toast("Nhập họ và tên.");
  localStorage.setItem(KEY, JSON.stringify(user));
  $("b-login").disabled = true;
  try { await hv.signIn(); await openDirectory(); }
  catch (e) { toast(errText(e)); }
  finally { $("b-login").disabled = false; }
};
$("b-logout").onclick = async () => { await hv.signOut().catch(() => {}); localStorage.removeItem(KEY); user = null; show("s-login"); };

// ── directory ────────────────────────────────────────────────────────────────
let all = [];
async function openDirectory() {
  $("hello").textContent = `Xin chào, ${user.name}`;
  show("s-dir");
  const r = await hv.destinations({ limit: 1000 });
  all = r.items;
  renderDir();
}
function renderDir() {
  const q = fold($("q").value.trim());
  const items = all.filter((d) => !q || fold(`${d.name} ${d.group ?? ""} ${d.code}`).includes(q));
  const list = $("dir-list"); list.textContent = "";
  if (!items.length) { list.innerHTML = `<div class="empty">Không tìm thấy nơi phù hợp.</div>`; return; }
  const groups = new Map();
  for (const d of items) { const g = d.group || "Khác"; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(d); }
  for (const [g, ds] of groups) {
    const h = document.createElement("div"); h.className = "group-h"; h.textContent = g; list.append(h);
    for (const d of ds) {
      const b = document.createElement("button"); b.className = "row";
      b.innerHTML = `<span class="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span style="min-width:0"><div class="t"></div><div class="d"></div></span>`;
      b.querySelector(".t").textContent = d.name;
      b.querySelector(".d").textContent = [d.chat && "Nhắn tin", d.voice && "Gọi thoại"].filter(Boolean).join(" · ");
      if (d.open !== null) { const s = document.createElement("span"); s.className = `badge ${d.open ? "open" : "closed"}`; s.textContent = d.open ? "Đang mở" : "Ngoài giờ"; b.append(s); }
      b.onclick = () => openDest(d);
      list.append(b);
    }
  }
}
$("q").oninput = renderDir;

// ── one destination ──────────────────────────────────────────────────────────
let dest = null;
function openDest(d) {
  dest = d;
  $("d-name").textContent = d.name; $("d-group").textContent = d.group ?? "";
  $("d-desc").textContent = d.description ?? cfg.destinationText;
  $("d-open").innerHTML = d.open === null ? "" : `<span class="badge ${d.open ? "open" : "closed"}" style="margin:0">${d.open ? "Đang trong giờ làm việc" : "Ngoài giờ làm việc"}</span>`;
  $("b-chat").disabled = !d.chat; $("b-call").disabled = !d.voice;
  show("s-dest");
}
$("b-chat").onclick = () => openChat();
$("b-call").onclick = () => startCall();
$("b-chat-call").onclick = () => startCall();

// ── chat ─────────────────────────────────────────────────────────────────────
let conv = null, unsub = null, aiHelping = false; const seen = new Set();
async function openChat() {
  $("c-name").textContent = dest.name; $("c-status").textContent = "Đang kết nối…";
  $("thread").textContent = ""; seen.clear(); aiHelping = false;
  show("s-chat");
  try {
    conv = await hv.start({ destination: dest.code, mode: "chat" });
    paintState(conv.state);
    unsub = hv.subscribe(conv.conversationId, { message: addMessage, state: paintState });
  } catch (e) {
    if (e instanceof HainivaError && e.code === "destination_closed") {
      sys(`Nơi này đang ngoài giờ. Bạn có thể để lại lời nhắn, ${staffLower} sẽ trả lời khi vào ca.`);
      conv = null;
    } else { toast(errText(e)); show("s-dest"); }
  }
}
function leaveChat() { unsub?.(); unsub = null; }
function paintState(s) {
  if (!s) return;
  const t = s.agent?.name ? `${s.agent.name} đang hỗ trợ bạn`
    : aiHelping && s.open ? "Trợ lý AI đang hỗ trợ bạn"
    : s.queuePosition ? `Đang chờ ${staffLower} · vị trí ${s.queuePosition}`
    : s.open ? `Đã gửi đến ${staffLower} tiếp nhận` : "Cuộc trò chuyện đã kết thúc";
  $("c-status").textContent = t;
}
function sys(text) { const d = document.createElement("div"); d.className = "sys"; d.textContent = text; $("thread").append(d); scrollEnd(); }
const scrollEnd = () => { const t = $("thread"); t.scrollTop = t.scrollHeight; };
let lastWho = null;
function addMessage(m) {
  if (seen.has(m.id)) return; seen.add(m.id);
  const th = $("thread");
  if (m.from === "system" && m.type !== "text") return;
  if (m.from === "system") { sys(m.text ?? ""); lastWho = null; return; }
  const mine = m.from === "me";
  if (m.from === "ai" && !aiHelping) { aiHelping = true; if (!/đang hỗ trợ bạn$/.test($("c-status").textContent) || /^Trợ lý/.test($("c-status").textContent)) $("c-status").textContent = "Trợ lý AI đang hỗ trợ bạn"; }
  if (!mine && lastWho !== (m.senderName ?? m.from)) {
    const w = document.createElement("div"); w.className = "who"; w.textContent = m.senderName ?? (m.from === "ai" ? "Trợ lý" : staff);
    if (m.from === "ai") { const a = document.createElement("span"); a.className = "ai"; a.textContent = "AI"; w.append(a); }
    th.append(w);
  }
  lastWho = mine ? null : (m.senderName ?? m.from);
  const b = document.createElement("div"); b.className = `msg ${mine ? "me" : "them"}`;
  if (m.attachment?.mime?.startsWith("image/")) { const img = document.createElement("img"); img.src = m.attachment.url; b.append(img); }
  else b.textContent = m.text ?? (m.attachment ? `📎 ${m.attachment.name ?? "Tệp đính kèm"}` : "");
  const t = document.createElement("div"); t.className = "time"; t.textContent = hhmm(m.at); b.append(t);
  th.append(b); scrollEnd();
}
$("composer").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("msg").value.trim(); if (!text) return;
  $("msg").value = "";
  try {
    if (!conv) { conv = await hv.start({ destination: dest.code, mode: "chat", text, leaveMessage: true }); unsub = hv.subscribe(conv.conversationId, { message: addMessage, state: paintState }); return; }
    await hv.send(conv.conversationId, text);
  } catch (err) { toast(errText(err)); $("msg").value = text; }
};

// ── voice ────────────────────────────────────────────────────────────────────
let room = null, timerT = null, startedAt = 0, ring = null;
function ringback(on) {
  // Vietnamese ring-back: 425 Hz, 1 s on, 4 s off.
  if (!on) { ring?.stop(); ring = null; return; }
  const ac = new AudioContext(); const o = ac.createOscillator(); const g = ac.createGain();
  o.frequency.value = 425; g.gain.value = 0; o.connect(g).connect(ac.destination); o.start();
  const beat = () => { const t = ac.currentTime; g.gain.setValueAtTime(0.12, t); g.gain.setValueAtTime(0, t + 1); };
  beat(); const iv = setInterval(beat, 5000);
  ring = { stop: () => { clearInterval(iv); o.stop(); ac.close(); } };
}
function callUi(status, ringing) { $("call-status").textContent = status; $("call-av").classList.toggle("ringing", !!ringing); }
async function startCall() {
  $("call-name").textContent = dest.name; $("call-timer").textContent = ""; $("b-mute").classList.remove("on");
  $("call").classList.add("on"); callUi("Đang kết nối…", true);
  try {
    const c = await hv.startCall(dest.code);
    room = new LK.Room({ adaptiveStream: true, dynacast: true });
    room.on(LK.RoomEvent.TrackSubscribed, (track) => { if (track.kind === "audio") { const el = track.attach(); el.dataset.call = "1"; document.body.append(el); } });
    room.on(LK.RoomEvent.ParticipantConnected, () => connected());
    room.on(LK.RoomEvent.ParticipantDisconnected, () => { if (room && room.remoteParticipants.size === 0 && startedAt) endCall(`${staff} đã kết thúc cuộc gọi`); });
    room.on(LK.RoomEvent.Disconnected, () => { if (room) endCall("Cuộc gọi đã kết thúc"); });
    await room.connect(c.livekit.url, c.livekit.token);
    await room.localParticipant.setMicrophoneEnabled(true);
    if (room.remoteParticipants.size > 0) connected();
    else { callUi("Đang đổ chuông…", true); ringback(true); }
  } catch (e) {
    endCall(e instanceof HainivaError ? errText(e) : "Không gọi được — kiểm tra quyền micro.");
  }
}
function connected() {
  if (startedAt) return;
  ringback(false); startedAt = Date.now(); callUi("Đã kết nối", false);
  timerT = setInterval(() => { const s = Math.floor((Date.now() - startedAt) / 1000); $("call-timer").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }, 500);
}
function endCall(reason) {
  ringback(false); clearInterval(timerT);
  const r = room; room = null; startedAt = 0; r?.disconnect();
  document.querySelectorAll("audio[data-call]").forEach((a) => a.remove());
  callUi(reason ?? "Cuộc gọi đã kết thúc", false);
  setTimeout(() => $("call").classList.remove("on"), 1300);
}
$("b-hang").onclick = () => endCall("Cuộc gọi đã kết thúc");
$("b-mute").onclick = async () => {
  if (!room) return;
  const muted = !$("b-mute").classList.contains("on");
  await room.localParticipant.setMicrophoneEnabled(!muted);
  $("b-mute").classList.toggle("on", muted);
};

// ── resume: a signed-in user goes straight to the directory ─────────────────
if (user && store.get()) { try { await hv.signIn(); await openDirectory(); } catch { show("s-login"); } }
</script>
</body>
